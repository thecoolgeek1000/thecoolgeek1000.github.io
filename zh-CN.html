<!-- 1. THE FRAMEWORK -->
<!-- This tells the browser: "Hey, I am a webpage!" -->
<!DOCTYPE html>
<html>
<head>

     <a href="https://thecoolgeek1000.github.io" style="text-decoration: none;">
    <button class="favorite styled" type="button"><h1>Devolver</h1></button>
</a>
    <!-- 2. THE PAINT & DECORATION (CSS) -->
    <!-- All of your styling goes right here inside these two tags -->
    <style>
        /* Your CSS styling rules live inside here */
        #myInput { width: 100%; font-size: 16px; padding: 12px; }
        #myUL { list-style-type: none; padding: 0; }
        #myUL li a { display: block; padding: 12px; background: #f6f6f6; color: black; text-decoration: none; }
        #myUL li a:hover { background: #eee; }
    </style>

</head>
<body>

    <!-- 3. THE FURNITURE (HTML) -->
    <!-- This is the actual text and search bar people see on the screen -->
    <input type="text" id="myInput" onkeyup="myFunction()" placeholder="&bsol;&#117;&#54;&#52;&#49;&#99;&bsol;&#117;&#55;&#100;&#50;&#50;&bsol;&#117;&#54;&#56;&#48;&#55;&bsol;&#117;&#57;&#56;&#57;&#56;&bsol;&#117;&#54;&#50;&#49;&#54;&bsol;&#117;&#56;&#48;&#48;&#53;&bsol;&#117;&#52;&#102;&#53;&#99;&bsol;&#117;&#56;&#48;&#48;&#53;...">

    <ul id="myUL">
        <li><a href="#">Learn Spanish by Mark Sample, CD, AUDIO 555.55</a></li>
        <li><a href="#">CIA World Factbook by Dark Horse Publishing, Book, 555.55 DAR</a></li>
        <li><a href="#">Call of the Wild by Jack London, Book, F LON</a></li>
        <li><a href="#">White Fang by Jack London, Book, F LON</a></li>
    </ul>

    <!-- 4. THE ELECTRICITY & PLUMBING (JavaScript) -->
    <!-- This makes the search bar actually DO something when you type -->
    <script>
        function myFunction() {
            var input = document.getElementById('myInput');
            var filter = input.value.toUpperCase();
            var ul = document.getElementById("myUL");
            var li = ul.getElementsByTagName('li');

            for (var i = 0; i < li.length; i++) {
                var a = li[i].getElementsByTagName("a")[0];
                var txtValue = a.textContent || a.innerText;
                if (txtValue.toUpperCase().indexOf(filter) > -1) {
                    li[i].style.display = "";
                } else {
                    li[i].style.display = "none";
                }
            }
        }
    </script>

</body>
</html>
